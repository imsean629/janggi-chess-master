<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>체스 마스터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="chess">
<div id="app">

  <!-- 시작 설정 -->
  <section id="setup" class="screen">
    <a class="back" href="index.html">← 게임 선택</a>
    <header class="hero">
      <h1>체스 마스터</h1>
      <p>상대의 수를 직접 입력하면, 내 차례에 최선의 수를 추천해 드려요.</p>
    </header>

    <div class="card">
      <h2>내 색</h2>
      <div class="seg" id="seg-me" role="radiogroup" aria-label="내 색">
        <button type="button" role="radio" data-v="1" class="white on"><b><span class="gl">♔&#xFE0E;</span> 백</b><span>아래 · 선공</span></button>
        <button type="button" role="radio" data-v="-1" class="black"><b><span class="gl">♚&#xFE0E;</span> 흑</b><span>위 · 후공</span></button>
      </div>
    </div>

    <div class="card">
      <h2>시작 국면</h2>
      <div class="seg small" id="seg-start" role="radiogroup" aria-label="시작 국면">
        <button type="button" role="radio" data-v="std" class="on"><b>표준 배치</b><span>처음부터</span></button>
        <button type="button" role="radio" data-v="fen"><b>FEN 입력</b><span>진행 중인 국면</span></button>
      </div>
      <div id="fen-box" hidden>
        <textarea id="fen-input" rows="2" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="예) r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3"></textarea>
        <p class="hint" id="fen-msg">체스 사이트의 ‘FEN 복사’ 값을 붙여 넣으세요. 둘 차례도 FEN에 들어 있어요.</p>
      </div>
    </div>

    <div class="card">
      <h2>추천 생각 시간</h2>
      <div class="seg small" id="seg-time" role="radiogroup" aria-label="생각 시간">
        <button type="button" role="radio" data-v="1000"><b>빠름</b><span>1초</span></button>
        <button type="button" role="radio" data-v="3000" class="on"><b>보통</b><span>3초</span></button>
        <button type="button" role="radio" data-v="8000"><b>깊게</b><span>8초</span></button>
        <button type="button" role="radio" data-v="20000"><b>최대</b><span>20초</span></button>
      </div>
    </div>

    <button id="btn-start" class="primary big" type="button">대국 시작</button>
    <button id="btn-resume" class="ghost big" type="button" hidden>이어서 두기</button>
    <p class="foot">엔진은 이 기기 안에서만 계산해요. 서버로 아무것도 보내지 않습니다.</p>
  </section>

  <!-- 대국 화면 -->
  <section id="game" class="screen" hidden>
    <div id="turnbar" class="turnbar">
      <span id="turn-dot" class="dot"></span>
      <span id="turn-text"></span>
      <span id="turn-badge" class="badge" hidden></span>
    </div>

    <div class="board-wrap">
      <svg id="board" viewBox="0 0 480 480" role="img" aria-label="체스판"></svg>
    </div>

    <div class="side">
    <div class="bar three" id="controls">
      <button id="btn-undo" type="button">↶ 무르기</button>
      <button id="btn-flip" type="button">⇅ 뒤집기</button>
      <button id="btn-menu" type="button">☰ 메뉴</button>
    </div>

    <div class="card reco" id="reco" aria-live="polite"></div>

    <details class="card" id="history-card">
      <summary>기보 <small id="hist-count"></small></summary>
      <ol id="history" class="chess-hist"></ol>
    </details>

    <details class="card" id="settings-card">
      <summary>설정</summary>
      <div class="setting">
        <span>생각 시간</span>
        <select id="sel-time">
          <option value="1000">빠름 (1초)</option>
          <option value="3000">보통 (3초)</option>
          <option value="8000">깊게 (8초)</option>
          <option value="20000">최대 (20초)</option>
        </select>
      </div>
      <label class="setting"><span>상대 차례에도 예상 수 보기</span><input type="checkbox" id="chk-opp"></label>
      <div class="setting"><span>추천 후보 수</span>
        <select id="sel-pv"><option value="1">1개</option><option value="2">2개</option><option value="3" selected>3개</option></select>
      </div>
    </details>
    </div>
  </section>
</div>

<!-- 메뉴 -->
<dialog id="dlg-menu">
  <form method="dialog">
    <h3>메뉴</h3>
    <button value="new" class="primary">새 대국 설정으로 돌아가기</button>
    <button value="restart">같은 설정으로 다시 시작</button>
    <button value="fen">현재 국면 FEN 복사</button>
    <button value="pgn">기보(PGN) 복사</button>
    <button value="home">게임 선택 화면으로</button>
    <button value="close" class="ghost">닫기</button>
  </form>
</dialog>

<!-- 프로모션 선택 -->
<dialog id="dlg-promo">
  <form method="dialog">
    <h3>어떤 기물로 승격할까요?</h3>
    <div class="promo-row" id="promo-row"></div>
    <button value="cancel" class="ghost">취소</button>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="chess-engine.js"></script>
<script src="chess-app.js"></script>
</body>
</html>
